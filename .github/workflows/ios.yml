# Builds the iOS app on GitHub's macOS runners and produces an unsigned .ipa.
# Install it with Sideloadly / AltStore (they sign it with your Apple ID).
name: iOS build

on:
  push:
    branches: [main, ios-app]
    paths:
      - "ios/**"
      - "assets/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned, for iPhone)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project VerseFeed.xcodeproj \
            -scheme VerseFeed \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/VerseFeed.app

      - name: Show compiler errors
        if: failure()
        working-directory: ios
        run: grep -E "error:" build.log | sort -u | head -60 || true

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VerseFeed.app Payload/
          zip -qry VerseFeed-unsigned.ipa Payload
          ls -lh VerseFeed-unsigned.ipa
          shasum -a 256 VerseFeed-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VerseFeed-ipa
          path: ios/VerseFeed-unsigned.ipa
          if-no-files-found: error

  # Runs the app in an iPhone simulator and screenshots each screen in each theme,
  # so the UI can be checked without a Mac or iPhone.
  screenshots:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project VerseFeed.xcodeproj -scheme VerseFeed -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

      - name: Boot an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "^ +iPhone 16 \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DEVICE" ]; then DEVICE=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'); fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true

      - name: Take screenshots
        working-directory: ios
        run: |
          mkdir -p shots
          xcrun simctl install "$DEVICE" simbuild/Build/Products/Debug-iphonesimulator/VerseFeed.app
          shoot() { # name, theme, screen
            xcrun simctl terminate "$DEVICE" com.versefeed.ios 2>/dev/null || true
            xcrun simctl launch "$DEVICE" com.versefeed.ios -bg_style "$2" -startScreen "$3" > /dev/null
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "shots/$1.png" > /dev/null
          }
          for theme in 0 1 2; do
            for screen in home read shuffle daily books chapters settings; do
              shoot "t${theme}-${screen}" "$theme" "$screen"
            done
          done
          ls shots

      - uses: actions/upload-artifact@v4
        with:
          name: VerseFeed-screenshots
          path: ios/shots

  # Records the simulator screen while a UI test drives every animated interaction, then cuts the
  # video into frame strips around each step so the animations can be checked frame by frame.
  animations:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen and ffmpeg
        run: brew install xcodegen ffmpeg

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Boot an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "^ +iPhone 16 \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DEVICE" ]; then DEVICE=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'); fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true

      - name: Build for testing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project VerseFeed.xcodeproj -scheme VerseFeed \
            -destination "id=$DEVICE" -derivedDataPath simtest CODE_SIGNING_ALLOWED=NO 2>&1 | tail -5

      - name: Record the animation tour
        working-directory: ios
        run: |
          xcrun simctl io "$DEVICE" recordVideo --codec h264 --force tour.mp4 > rec.log 2>&1 &
          REC=$!
          for i in $(seq 1 100); do grep -q "Recording started" rec.log && break; sleep 0.1; done
          python3 -c 'import time; print(time.time())' > start.txt
          xcodebuild test-without-building -project VerseFeed.xcodeproj -scheme VerseFeed \
            -destination "id=$DEVICE" -derivedDataPath simtest CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee test.log | grep -E "STEP |Test Case|error:|XCTAssert|failed" || true
          sleep 1
          python3 -c 'import time; print(time.time())' > stop.txt
          kill -INT $REC; wait $REC || true
          ls -lh tour.mp4

      - name: Cut frame strips around each step
        working-directory: ios
        run: |
          mkdir -p frames
          python3 - <<'EOF'
          import re, subprocess
          steps = []
          for line in open("test.log", errors="ignore"):
              m = re.search(r"STEP (\S+) (\d+\.\d+)", line)
              if m and (m.group(1), m.group(2)) not in [(s[0], s[1]) for s in steps]:
                  steps.append((m.group(1), m.group(2)))
          # The simulator recorder's clock can't be matched to the test's, so the test taps a hidden
          # button that flashes the screen magenta; find the first magenta frame in the video and
          # place every step relative to it.
          FPS = 30
          proc = subprocess.run(["ffmpeg", "-loglevel", "error", "-i", "tour.mp4", "-vf",
                                 f"fps={FPS},scale=4:4,format=rgb24", "-f", "rawvideo", "-"], capture_output=True)
          raw = proc.stdout
          frame = 4 * 4 * 3
          anchor = None
          samples = []
          for i in range(len(raw) // frame):
              px = raw[i * frame:(i + 1) * frame]
              # average of the 16 pixels
              r = sum(px[0::3]) / 16; g = sum(px[1::3]) / 16; b = sum(px[2::3]) / 16
              if i % 60 == 0: samples.append((round(i / FPS, 1), int(r), int(g), int(b)))
              if r > 180 and g < 110 and b > 180:
                  anchor = i / FPS
                  break
          t_sync = float(dict(steps)["sync"])
          print("decoded frames:", len(raw) // frame, "ffmpeg err:", proc.stderr[:200])
          print("colour samples (time, r, g, b):", samples[:20])
          print("magenta flash found at video time", anchor)
          start = t_sync - (anchor or 0.0)  # each STEP is logged right after its action
          for i, (name, t) in enumerate(steps):
              # From just before the action to well after it (the STEP is logged as it lands).
              off = max(0.0, float(t) - start - (1.4 if name in ("swipe-slow", "swipe-short", "pull-daily") else 0.3))
              dur = 2.8 if name in ("swipe-slow", "swipe-short", "pull-daily") else 1.4
              fps = 5 if dur > 2 else 10
              out = f"frames/{i:02d}-{name}.png"
              subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-ss", f"{off:.2f}", "-t", f"{dur}",
                              "-i", "tour.mp4", "-vf",
                              f"fps={fps},scale=200:-1,tile=14x1:padding=4:margin=4:color=white",
                              "-frames:v", "1", out], check=False)
              print(name, f"{off:.2f}s", out)
          EOF
          ls frames

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VerseFeed-animations
          path: |
            ios/frames
            ios/tour.mp4
            ios/test.log
