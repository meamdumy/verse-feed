# XcodeGen spec for the iOS version of Verse Feed. CI runs `xcodegen generate` to create
# VerseFeed.xcodeproj, so the project file itself never needs editing by hand.
name: VerseFeed
options:
  bundleIdPrefix: com.versefeed
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.6"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Built unsigned; Sideloadly (or Xcode) signs it with your Apple ID when installing.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  VerseFeed:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - VerseFeedUITests
    sources:
      - path: VerseFeed
      # The same Bible texts and verse-of-the-day list as the Android app.
      - path: ../assets/web.txt
        buildPhase: resources
      - path: ../assets/bsb.txt
        buildPhase: resources
      - path: ../assets/daily.txt
        buildPhase: resources
    info:
      path: VerseFeed/Info.plist
      properties:
        CFBundleDisplayName: Verse Feed
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.versefeed.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
  # Simulator-only UI test that drives every animation while CI records the screen.
  VerseFeedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: VerseFeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.versefeed.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: VerseFeed
